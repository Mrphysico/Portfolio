[package]
name = "wasm-core"
version = "0.1.0"
edition = "2021"
authors = ["Arth Jadav <https://github.com/Mrphysico>"]
description = "High-performance 4D mathematics, regular polytopes, quaternion Julia slice, and physics engine for The Dimensional Portfolio."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
