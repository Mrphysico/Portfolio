version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_REALTIME_WS=ws://localhost:8080/ws
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - realtime-go
      - api-python

  realtime-go:
    build:
      context: ./realtime-go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  api-python:
    build:
      context: ./api-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./api-python/guestbook.db:/app/guestbook.db
